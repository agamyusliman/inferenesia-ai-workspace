<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Inferenesia</title>
    <script>
      try {
        var t = localStorage.getItem('inferenesia-theme') || localStorage.getItem('yura-ai-theme')
        if (t === 'warm' || t === 'dark' || t === 'light') {
          document.documentElement.dataset.theme = t
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-shell-bg text-shell-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
